name: TYPO3 Extension CI (Reusable)

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version to use
        type: string
        default: '8.5'
      extension-path:
        description: Checkout path for the extension under test (siblings resolve as ../typo3-extension-*)
        type: string
        default: extension
    secrets:
      package-token:
        description: Optional PAT/GitHub App token with read access to private mai-space-de package repos (and monorepo for in-tree packages like mai-turbo)
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.extension-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ inputs.extension-path }}
          persist-credentials: false

      - name: Checkout CI helper scripts
        uses: actions/checkout@v4
        with:
          repository: mai-space-de/ci-workflows
          path: _ci-workflows
          sparse-checkout: |
            scripts
            in-tree
          token: ${{ secrets.package-token || github.token }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none
          ini-values: memory_limit=1G

      - name: Resolve maispace path dependencies
        env:
          GH_TOKEN: ${{ secrets.package-token || github.token }}
        run: |
          set +e
          bash "${{ github.workspace }}/_ci-workflows/scripts/resolve-maispace-deps.sh" >"$RUNNER_TEMP/resolve.log" 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed -E 's#x-access-token:[^@ ]+#x-access-token:***#g' | cut -c1-350)
              echo "::error::$safe"
            done < "$RUNNER_TEMP/resolve.log"
          fi
          exit "$code"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles(format('{0}/composer.lock', inputs.extension-path)) }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Restore composer files after path-repo wiring
        run: |
          if [ -f composer.json.ci-bak ]; then
            mv composer.json.ci-bak composer.json
          fi
          if [ -f composer.lock.ci-bak ]; then
            mv composer.lock.ci-bak composer.lock
          else
            # composer install wrote a lock for the temporary path repos.
            # Packages that do not commit a lock must not validate that file.
            rm -f composer.lock
          fi

      - name: Run all linters
        run: |
          set +e
          composer lint:check >"$RUNNER_TEMP/lint.log" 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed -E 's#x-access-token:[^@ ]+#x-access-token:***#g' | cut -c1-350)
              echo "::error::$safe"
            done < "$RUNNER_TEMP/lint.log"
          fi
          exit "$code"

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.extension-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ inputs.extension-path }}
          persist-credentials: false

      - name: Checkout CI helper scripts
        uses: actions/checkout@v4
        with:
          repository: mai-space-de/ci-workflows
          path: _ci-workflows
          sparse-checkout: |
            scripts
            in-tree
          token: ${{ secrets.package-token || github.token }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none
          ini-values: memory_limit=1G

      - name: Resolve maispace path dependencies
        env:
          GH_TOKEN: ${{ secrets.package-token || github.token }}
        run: |
          set +e
          bash "${{ github.workspace }}/_ci-workflows/scripts/resolve-maispace-deps.sh" >"$RUNNER_TEMP/resolve.log" 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed -E 's#x-access-token:[^@ ]+#x-access-token:***#g' | cut -c1-350)
              echo "::error::$safe"
            done < "$RUNNER_TEMP/resolve.log"
          fi
          exit "$code"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles(format('{0}/composer.lock', inputs.extension-path)) }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Restore composer files after path-repo wiring
        run: |
          if [ -f composer.json.ci-bak ]; then
            mv composer.json.ci-bak composer.json
          fi
          if [ -f composer.lock.ci-bak ]; then
            mv composer.lock.ci-bak composer.lock
          else
            # composer install wrote a lock for the temporary path repos.
            # Packages that do not commit a lock must not validate that file.
            rm -f composer.lock
          fi

      - name: Run tests
        run: |
          set +e
          composer test >"$RUNNER_TEMP/test.log" 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed -E 's#x-access-token:[^@ ]+#x-access-token:***#g' | cut -c1-350)
              echo "::error::$safe"
            done < "$RUNNER_TEMP/test.log"
          fi
          exit "$code"
